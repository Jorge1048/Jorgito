<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manga PDF Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>MANGA PDF MANAGER</h1>
  <p>Todo se procesa en tu navegador. Ningún PDF sale de tu dispositivo.</p>
</header>
<main>
  <label id="drop" class="card drop">
    <input id="file" type="file" accept=".pdf,application/pdf" multiple hidden>
    <b>📂 Seleccionar archivos PDF</b>
    <small>o arrástralos hasta aquí</small>
  </label>

  <section id="app" hidden>
    <div class="card"><div class="stats" id="stats"></div></div>
    <div class="card row">
      <label>Tamaño máximo por archivo (GB)
        <input id="max" type="number" min="0.1" step="0.1" value="2"></label>
      <button id="go" class="primary">📚 CREAR PDFs</button>
      <button id="auto" hidden>↕ Orden automático</button>
      <button id="clear">Limpiar</button>
    </div>
    <div class="card" id="prog" hidden></div>
    <div class="card"><h2>🔔 Notificaciones</h2><ul id="notes"></ul></div>
    <div class="card"><h2>Lotes pendientes</h2><div id="batches"></div></div>
    <div class="card"><h2>Archivos</h2><p class="hint">Mantén presionado un archivo y arrástralo para cambiar su posición.</p><ul id="files"></ul></div>
  </section>
</main>

<dialog id="dlg">
  <h3>Nombre del archivo</h3>
  <input id="nm" aria-label="Nombre del archivo">
  <p id="dinfo"></p>
  <button id="dl" class="primary">⬇️ Descargar</button>
</dialog>

<!-- pdf-lib: única petición externa (solo descarga la librería; los PDFs nunca se envían) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="script.js"></script>
</body>
</html>
